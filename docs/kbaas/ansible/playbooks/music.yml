---
- name: Baseline
  ansible.builtin.import_playbook: baseline.yml


- name: Music container
  hosts: localhost
  connection: local
  become: true

  tasks:
    - name: Update apt cache and install packages
      ansible.builtin.apt:
        update_cache: true
        name:
          - python3
          - python3-pip
          - 7zip
          - ffmpeg
        state: present

    - name: Install yt-dlp
      ansible.builtin.get_url:
        url: https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp
        dest: /sbin/yt-dlp
        mode: "0755"

    - name: Download Deno install script
      ansible.builtin.get_url:
        url: https://deno.land/install.sh
        dest: /root/install.sh
        mode: "0755"

    - name: Install Deno
      ansible.builtin.command: bash /root/install.sh -y
      args:
        creates: /root/.deno/bin/deno
      environment:
        HOME: /root